services:
  db:
    image: postgres:16-alpine
    container_name: teskel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teskel
      POSTGRES_PASSWORD: teskel
      POSTGRES_DB: teskel
    ports:
      - "5433:5432"
    volumes:
      - teskel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teskel -d teskel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  teskel_pgdata: